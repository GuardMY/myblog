version: '3.8'

services:
  # 数据库服务
  db:
    image: mysql:8.0.45-bookworm
    container_name: blog-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: blog
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: blogpass123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-init:/docker-entrypoint-initdb.d
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/blog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "bloguser"
      SPRING_DATASOURCE_PASSWORD: "blogpass123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQL8Dialect"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "100MB"
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "100MB"
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - blog-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:8080/api/blogs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blog-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - blog-network

# 网络配置
networks:
  blog-network:
    driver: bridge

# 卷配置
volumes:
  mysql-data:
    driver: local
  mysql-init:
    driver: local
  backend-uploads:
    driver: local
