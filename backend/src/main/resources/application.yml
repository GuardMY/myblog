# 数据库连接配置
spring:
  datasource:
    url: jdbc:mysql://192.168.31.91:3306/blog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # MyBatis Plus 配置
  mybatis-plus:
    mapper-locations: classpath:/mappers/**/*.xml
    type-aliases-package: com.blog.entity
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      map-underscore-to-camel-case: true
  # 其他配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  security:
    user:
      name: admin
      password: admin123
      roles: ADMIN

# 服务器配置
server:
  port: 8080