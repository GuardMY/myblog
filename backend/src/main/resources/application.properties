# 数据库连接配置
spring.datasource.url=jdbc:mysql://192.168.31.91:3306/blog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123456
